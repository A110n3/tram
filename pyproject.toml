[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tram"
version = "0.3.0"
description = "Tram - 离线划词翻译，接入本地大模型"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "A110n3" }]
dependencies = [
    "PyQt6>=6.6",
    "httpx>=0.27",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "respx>=0.21",
    "pyinstaller>=6.0",
    "pefile>=2023.2.7",  # tools/fetch_tesseract.py 剥离调试节区
]

[project.gui-scripts]
tram = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E402"]  # 模块级 import 在条件分支之后（Win32 场景常见）

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # 测试中可用 assert False

# ---------- mypy ----------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true  # PyQt6/pywin32 无 stub
check_untyped_defs = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
