name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Build exe
        run: python -m PyInstaller tram.spec --noconfirm

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Tram.exe
