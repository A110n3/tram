[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tram"
dynamic = ["version"]  # 版本唯一来源为 app.__version__
description = "Tram - 离线划词/识图翻译，接入本地大模型"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "A110n3" }]
dependencies = [
    "PyQt6>=6.6",
    "httpx>=0.27",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "respx>=0.21",
    "pyinstaller>=6.0",
]
# OCR 与监控为可选依赖：纯划词用户不被迫装 ~150MB 引擎栈。
# rapidocr 2→3 换过 result.txts API，上界挡 breaking change；
# onnxruntime 1.24.1 是 cp314 wheel 起点（CI 的 3.12 亦满足）；
# opencv-python 与 numpy 为监控功能帧差法/预处理依赖（rapidocr 亦需要）。
ocr = [
    "rapidocr>=3.9,<4",
    "onnxruntime>=1.24.1",
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.gui-scripts]
tram = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E402"]  # 模块级 import 在条件分支之后（Win32 场景常见）

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # 测试中可用 assert False

# ---------- mypy ----------
[tool.mypy]
# 3.12 而非 requires-python 的 3.10 下限：numpy 2.5 的 stub 使用
# `type` 语句等 3.12+ 语法，且 follow_imports=skip 也无法阻止 mypy
# 解析直接导入模块的 stub（语法错误直接 bail）。开发 venv 为 3.14，
# 打包随 venv 走，取 3.12 兼顾 stub 可用性与贴近运行环境。
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true  # pywin32 等无 stub（PyQt6 6.9+ 已自带类型）
check_untyped_defs = true

# OCR/监控图像栈不跟随类型检查：图像数组全程按 Any 传递，
# 跳过可省去庞大 stub 图的语义检查耗时
[[tool.mypy.overrides]]
module = ["rapidocr.*", "numpy", "numpy.*", "cv2", "cv2.*", "PIL", "PIL.*"]
follow_imports = "skip"

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
